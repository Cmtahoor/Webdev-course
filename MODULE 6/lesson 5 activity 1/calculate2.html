<!DOCTYPE html>
<html>

<head>
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <style>
        body {
            border-color: black;
            font-family: sans-serif;
        }

        .container {
            background-color: aliceblue;
            height: 500px;
            width: 400px;
            background-image: linear-gradient(to bottom, rgb(16, 31, 124),rgb(243, 174, 185));
        }

        button {
            border: 0px;
            border-radius: 50%;
            height: 40px;
            width: 40px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: yellow;
        }

        button:focus {
            outline: 0px;
        }

        button:active{
            font-size: 9px;
        }

        #result{
            height: 50px;  
        }

        #history{
            height: 20px;
            padding-top: 20px;
            text-align: center;
            font-size: 15px;
        }

        #output{
            text-align: center;
            height: 60px;
            font-size: 30px;
        }

        #\*{
        background-color: orange;
       }

       #\%{
        background-color: red ;
       }

       #\/{
        background-color: grey ;
       }

       #\-{
        background-color: yellow ;
       }

       #\+{
        background-color: blue ;
       }

       #\={
        background-color: goldenrod ;
       }

    
    </style>
</head>

<body>

    <div class="container" id="keyboard">
        <div>
         <div id="result">
            <div id="history">
              <p id="history-value"></p>
            </div>
            <div id="output">
              <p id="output-value"></p>
            </div>
        </div>



        <div class="row m-5">

            <div class="col-3">
                <div>
                    <button class="operator" id="clear">C</button>
                </div>
            </div>

            <div class="col-3">
                <div>
                    <button class="operator" id="backspace">CE</button>
                </div>
            </div>

            <div class="col-3">
                <div>
                    <button class="operator" id="%">%</button>
                </div>
            </div>

            <div class="col-3">
                <div>
                    <button class="operator" id="/">/</button>
                </div>
            </div>
        </div>

        <div class="row m-5">

            <div class="col-3">
                <div>
                    <button class="number" id="7">7</button>
                </div>
            </div>

            <div class="col-3">
                <div>
                    <button class="number" id="8">8</button>
                </div>
            </div>

            <div class="col-3">
                <div>
                    <button class="number" id="9">9</button>
                </div>
            </div>

            <div class="col-3">
                <div>
                    <button class="operator" id="*">*</button>
                </div>
            </div>
        </div>

        <div class="row m-5">

            <div class="col-3">
                <div>
                    <button class="number" id="4">4</button>
                </div>
            </div>
            <div class="col-3">
                <div>
                    <button class="number" id="5">5</button>
                </div>
            </div>
            <div class="col-3">
                <div>
                    <button class="number" id="6">6</button>
                </div>
            </div>

            <div class="col-3">
                <div>
                    <button class="operator" id="-">-</button>
                </div>
            </div>
        </div>

        <div class="row m-5">
            <div class="col-3">
                <div>
                    <button class="number" id="1">1</button>
                </div>
            </div>
            <div class="col-3">
                <div>
                    <button class="number" id="2">2</button>
                </div>
            </div>
            <div class="col-3">
                <div>
                    <button class="number" id="3">3</button>
                </div>
            </div>
            <div class="col-3">
                <div>
                    <button class="operator" id="+">+</button>
                </div>
            </div>
        </div>

        <div class="row m-5">
            <div class="col-6">
                <div>
                    <button class="number" id="0">0</button>
                </div>
            </div>
            <div class="col-6">
                <div>
                    <button class="operator" id="=">=</button>
                </div>
            </div>
        </div>
    </div>

    <script>

    </script>
</body>

</html>
