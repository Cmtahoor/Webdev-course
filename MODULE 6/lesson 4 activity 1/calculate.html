<!DOCTYPE html>
<html>
    <head>
        <title>CALCULATOR</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"/>
        <style>
            body{
              border-color: black;
            }
            .container{
                background-color: aliceblue;
                height: 500px;
                width: 400px;
            }
            button{
                border: 0px;
                border-radius: 50%;
                height: 40px;
                width: 40px;
            }
            button:hover{
                background-color: yellow;
            }
            button:focus{
                outline: 0px;
            }

        </style>
    </head>
    <body>

        <div class="container">
            <div class="row m-5">

                <div class="col-3">
                    <div>
                        <button>C</button>
                    </div>
                </div>

                <div class="col-3">
                    <div>
                    <button>CE</button>
                    </div>
                </div> 

                <div class="col-3">
                    <div>
                        <button>%</button>
                    </div>
                </div>

                <div class="col-3">
                    <div>
                    <button>/</button>
                    </div>
                </div>
            </div>

            <div class="row m-5">

                <div class="col-3">
                    <div>
                    <button>7</button>
                    </div>
                </div>
                
                <div class="col-3">
                    <div>
                    <button>8</button>
                    </div>
                </div> 
                
                <div class="col-3">
                    <div>
                    <button>9</button>
                    </div>
                </div>

                <div class="col-3">
                    <div>
                    <button>*</button>
                    </div>
                </div>
            </div>

            <div class="row m-5">

                <div class="col-3">
                    <div>
                    <button>4</button>
                    </div>
                </div>
                <div class="col-3">
                    <div>
                    <button>5</button>
                    </div>
                </div>
                <div class="col-3">
                    <div>
                     <button>6</button>
                    </div>
                </div> 

                <div class="col-3">
                    <div>
                     <button>-</button>
                    </div>
                </div>    
            </div>    

            <div class="row m-5">
                <div class="col-3">
                    <div>
                      <button>1</button>
                    </div>
                </div>
                <div class="col-3">
                    <div>
                      <button>2</button>
                    </div>
                </div>
                <div class="col-3">
                    <div>
                      <button>3</button>
                    </div>
                </div>
                <div class="col-3">
                    <div>
                      <button>+</button>
                    </div>
                </div>   
            </div>    

            <div class="row m-5"> 
             <div class="col-6">
                    <div>
                     <button>0</button>
                    </div>
                </div>
              <div class="col-6">
                    <div>
                     <button>=</button>
                    </div>
                </div>
            </div>
          </div>
        </div>

        <script>

        </script>
    </body>
</html>
