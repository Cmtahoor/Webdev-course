<!DOCTYPE html>
<html>
    <head>   
        <title>    
            Doctors appointment
        </title>
    </head>
    <body>
        <form>
        <fieldset>

            <legend>PERSONAL DETAILS</legend>
            <label>Your name</label> <br>
            <input type="text"   placeholder="Enter your full name"> <br> <br>
            <label>Patient id</label> <br>
            <input type="password" placeholder="Your secret id"><br><br>

            <label>Date of birth</label> <br>
            <input type="date">  <br>  

        </fieldset>

        <fieldset>
            <legend>YOUR VISIT</legend>
            <label>why are you visiting</label> <br>
            <input type="radio" value="fever"  name="illness">fever <br>
            <input type="radio" value="cold"   name="illness">cold <br>


            <label>Any notes for the doctor</label><br>
            <textarea rows="4"  cols="4"  placeholder="e.g.I have a headache"> </textarea> <br>


           <label>PREFERRED VISIT DAY </label>
           <input type="checkbox" value="monday" name="monday">monday <br>
           <input type="checkbox" value="wednesday" name="wednesday">wedmesday <br>

           <input type="submit" value="BOOK MY APPOINTMENT">

        </fieldset>
        </form>
    </body>
</html>
