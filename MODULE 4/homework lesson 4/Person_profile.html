<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Person Profile</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: cyan;
        }

        h1 {
            color: blue;
        }

        .card-label {
            font-size: 11px;
            color: black;
            text-transform: uppercase;
        }

        pre {
            font-size: 13px;
            color: royalblue;
        }
    </style>
</head>

<body class="py-4">

    <div class="container">
        <h1 class="mb-1">Person Profile</h1>
        <p class="text-muted mb-4">Introduction to Objects in JavaScript</p>

        <div class="card shadow-sm mb-3" style="max-width:400px;">
            <div class="card-body" style="background-color: darksalmon;">
                <h5 class="card-title" style="color: white;">Profile Details</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><span class="card-label d-block">Name</span><strong id="name">-</strong></li>
                    <li class="list-group-item"><span class="card-label d-block">Relationship</span><strong id="relationship">-</strong></li>
                    <li class="list-group-item"><span class="card-label d-block">Favourite Activity</span><strong id="activity">-</strong></li>
                    <li class="list-group-item"><span class="card-label d-block">City</span><strong id="city">-</strong></li>
                </ul>
            </div>
        </div>

        <div class="card shadow-sm" style="max-width:400px;">
            <div class="card-body">
                <h6 style="color: rgb(123, 36, 185);">JavaScript Object </h6>
                <pre id="codeshow" class="bg-light p-3 rounded border mb-0"></pre>
            </div>
        </div>
    </div>

    <script>

        var favouritePerson = {
            name: "Tahoor",
            relationship:"friend",
            activity: "flying academy , playing squash",
            city: "Karachi"
        };

        var nameEl= document.getElementById("name");
        var relationshipEl= document.getElementById("relationship");
        nameEl.textContent = favouritePerson.name;
        relationshipEl.textContent = favouritePerson.relationship

        var activityEl= document.getElementById("activity");
        var cityEl= document.getElementById("city");
        activityEl.textContent = favouritePerson["activity"];
        cityEl.textContent = favouritePerson["city"];

        var codeEl= document.getElementById("codeshow");
        codeEl.textContent = 
        'var favouriteperson = {\n' +
        ' name:        "' + favouritePerson.name +'",\n' +
        ' relationship:"' + favouritePerson.relationship + '",\n' +
        ' activity:    "' + favouritePerson["activity"] + '",\n' +
        ' city:        "' + favouritePerson["city"] +'", \n' +
        '};';


    </script>
</body>

</html>
