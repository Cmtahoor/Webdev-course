        <p id="p1"></p>

        <script>
            
            var fruits =['mango','banana','apple','orange'];

            var myjoin = fruits.join('---');

            document.getElementById("p1").innerHTML = fruits;

            fruits.pop();

            document.getElementById("p2").innerHTML = fruits;

            function add(a, b) {
                    var sum = a + b;
                    return sum;
            }
           
            function average(a, b) {

                 var sum = add(a,b);
                 var avg = sum/2;
                 return avg;
