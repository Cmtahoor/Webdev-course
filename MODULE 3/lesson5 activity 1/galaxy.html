<!DOCTYPE html>
<html>
    <head>
        <title>PlANET EXPLORER</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>

         body{

            background-color: #b7caff;
         }
          nav{
            background-color: #1a237e;
         
          }

          li,li > a{ 
           color: white;
          }

        </style>
    </head>
    <body>
      <nav class="navbar navbar-expand-sm">
         <a class="navbar-brand" >Planet Explorer</a>
         
         <ul class="navbar-nav">
         <li class="nav-item"><a class="nav-link" href="#"> Home</a></li>
         <li class="nav-item"><a class="nav-link" href="#">Planets</a></li>
         <li class="nav-item"><a class="nav-link" href="#">Stars</a></li>
         </ul>
        </nav>

        <div class="container">
           <h2>Scaning galaxy......</h2>
           <div class="spinner-border text-primary"></div>
           <div class="spinner-border text-warning"></div>
          <div class="spinner-border text-danger"></div>

        

        
         <div class="row">
            <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title">Earth</h3>
                        <p  class="card-text">Our home planet-known to have life!Explore</p>
                    </div>
                </div>
            </div>

           <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title">Mars</h3>
                        <p class="card-text">The red planet — one day humans may live here!Explore</p>
                    </div>
                </div>
            </div>

           <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title">Jupiter</h3>
                        <p class="card-text">The biggest planet — its giant storm never stops! Explore</p>
                    </div>
                </div>
            </div>
        </div>
        
    </body>
