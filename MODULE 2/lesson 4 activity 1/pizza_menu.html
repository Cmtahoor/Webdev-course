 }
 h1+p{
    border-radius: 3px;
    background-color: rgb(220, 183, 127);

 }
 ul>li{
    list-style: none;
    font-weight: bold;
    font-size: 18px;
    color: rgba(230, 82, 72, 0.899);

    background-color: beige;
 }

 ul>li:nth-child(5){
 background-color: yellow;
 color: orange;
 }

.para{
    font-size: 25px;
    color: #860a86;
}
 .para::first-letter{
   color: orange;
   font-size: 35px;

 }
 a{
    color: #e65cc0;
    text-decoration: none;
    font-size: 25px ;
    border-radius: 5px ;
    border: 2px solid indigo;
 }
 a:hover{
  background-color: crimson;
  color: ghostwhite;
 }

 </style>
