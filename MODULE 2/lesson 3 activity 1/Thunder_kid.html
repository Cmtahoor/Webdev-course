<!DOCTYPE html>
<html>
    <head>
        <title>THUNDER KID</title>
        <style>
       body{

       font-family: Arial, Helvetica, sans-serif;
       background-color: darkblue; 
       color: white;
       }
        
       .hero_name{

        font-size: 60px;
        font-weight: bold;
        color: yellow;
        text-shadow: 10px 10px black;
       }

       .tag_line{

        text-transform: capitalize;
        font-style: italic;
        color: lightblue;
       }
      .label{

        text-decoration: underline;
        text-transform: uppercase;
        color: coral;
      }
      .not_wanted{
        text-decoration: line-through;
        color: grey;
      }
      .badge{

        transform: rotate(7deg);
        color: yellow;
        font-size: 50px;
      }
      .made_by{
        font-style: italic;
        color: coral;

      }

        </style>
    </head>
    <body>
 <h1 class="hero_name">Thunder Kid</h1>
 <p class="tag_line">
 the most powerful hero in the school
 </p>

 <h2 class="label">super powers</h2>
 <p>
  Can run faster than a cheetah 
 </p>
 <p>
  Can lift a school bus
 </p>

 <h2 class="label">weaknesses</h2>

 <p class="not_wanted">Maths homework</p>

 <p class="not_wanted">Broccoli</p>

 <h3 class="badge">Top Hero</h3>

 <p class="made_by">Created by ___________</p>



    </body>
</html>
