<!DOCTYPE html>
<html>
    <head>
      <title>MY PET PAGE</title>
       <style>

        body{
            color: ghostwhite;
            padding: 15px;
            background-color: lightyellow;
            font-family: Arial, Helvetica, sans-serif;
            height: 1200px;
        }

        .boxing{
            background-color: orangered;
            color: white;
            padding: 2px;
            position: fixed;
            top: 0px;
            right: 0px;
            left: 0px;
        }
       
        .height{
            color: orange;
        }

        h3{
            color: orange;
        }
        
        .box{
            border: 2px solid orange;
            padding: 2px;
            background-color: white;
            color: black;
            margin: 6px;
        }

        .box_month{
            color: black;
            background-color: rgb(255, 89, 0);
            padding: 4px;
            position: relative;
            left: 25px;
        }

        .badge{
            color:black ;
        }

        .box_i{
            border: 2px solid orange;
            padding: 10px;
            background-color: white;
            color: black;
            margin: 6px;
            position: relative;
    
        }
        .Adopted{
            color: whitesmoke;
            background-color: green;
            width: fit-content;
            position: absolute;
            right: 15px;
            bottom: 15px;
        }
        
       </style>
    </head>
    <body>
        <div class="boxing">
     <p>My Pet Page - Buddy the Labrador</p>
     </div>

   <h1 class="height"> Meet Buddy!</h1>
    
    <h3>Static</h3>
    <div class="box">
    Breed: Labrador
    </div>
    <div class="box">
    Age: 2 years old
    </div>

    <h3>Relative</h3>
    
    <p class="badge">This note shifts right from its normal spot.</P>
    <div class="box_month">
    Pet of the Month!
    </div>

   <h3>Absolute</h3>
    
    <p class="badge">The badge is pinned to the corner of the card.</p>
    <div class="box_i">
    Buddy - Labrador, 2 years
    <div class="Adopted">
    Adopted!
    </div>
    </div>
    </body>
</html>
