<!DOCTYPE html>
<html>
    <head>
        <style>
           body {
                font-family: Arial, sans-serif;
                background: aliceblue;
                text-align: center;
                padding: 30px;
            }

            h1 {
                color: navy;
            }

            input {
             padding: 8px;
             margin: 5px;
             border: 2px solid navy;
             border-radius: 6px;
             width: 220px;
           }

           button {
             background: navy;
             color: white;
             padding: 10px 25px;
             border: none;
             border-radius: 20px;
             cursor: pointer;
            }

        </style>
    </head>
    <body>
        <h1>Lucky Draw</h1>
        <p>Enter </p>
        <input id="username" placeholder="Your Name" type="text" required>

        <input id="usernumber" placeholder="Guess number" type="number" required min="1" max="5">
        
        <button onclick="find_luck()">Try my luck</button>

        <p id="timer"></p>

        <p id="msg-name"></p>

        <p id="msg-guess"></p>
        <p id="result"></p>


        <script>

            var seconds = 0
             setInterval(function () {
                seconds = seconds+1
                document.getElementById("timer").innerHTML = "You have stayed on website for " + seconds + " seconds "
                
             },1000)


            function find_luck (){

                var flagusername = true;
                var flagusernumber=true;


                var username = document.getElementById("username").value;  

                if(username == ""){
                    
                    document.getElementById("msg-name").innerHTML = "ENTER A NAME";

                    document.getElementById("msg-name").style.color="red";
                    flagusername = false
                }

                var usernumber = document.getElementById("usernumber").value;

                if (usernumber == "") {

                    document.getElementById("msg-guess").innerHTML ="ENTER A VALID NUMBER";

                    document.getElementById("msg-guess").style.color = "red";
                    flagusernumber = false
                }

                if(flagusername==true & flagusernumber== true){

                    var secret = Math.floor(Math.random()*5)+1;
                    if (usernumber == secret){
                        document.getElementById("result").innerText = "your number is correct"
                    }

                    else  {
                        document.getElementById("result").innerText = "your number is incorrect"
                    }

                }
            }


             
        </script>
    </body>
</html>
